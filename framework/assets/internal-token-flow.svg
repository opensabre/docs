<style>.title{font:700 24px system-ui,sans-serif;fill:#17384d}.label{font:600 16px system-ui,sans-serif;fill:#17384d}.note{font:14px system-ui,sans-serif;fill:#526b7a}.arrow{stroke:#31566f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
