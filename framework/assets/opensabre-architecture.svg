    <rect class="app-item" x="16" y="35" width="94" height="36"/><text class="item-text" x="63" y="53">字典添加</text>
    <rect class="app-item" x="16" y="87" width="94" height="36"/><text class="item-text" x="63" y="105">字典引用</text>
    <rect class="app-item" x="16" y="139" width="94" height="36"/><text class="item-text" x="63" y="157">字典维护</text>
  </g>
  <g transform="translate(496 52)">
    <rect class="group" width="126" height="240"/><text class="group-title" x="8" y="22">密钥管理</text>
    <rect class="planned" x="16" y="35" width="94" height="36"/><text class="item-text" x="63" y="53">密钥生成</text>
    <rect class="planned" x="16" y="87" width="94" height="36"/><text class="item-text" x="63" y="105">密钥分发</text>
    <rect class="planned" x="16" y="139" width="94" height="36"/><text class="item-text" x="63" y="157">密钥查看</text>
