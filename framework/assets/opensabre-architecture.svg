  <!-- 基础设施 -->
  <rect x="20" y="600" width="1240" height="100" fill="#a7b0ed"/>
  <rect x="20" y="600" width="44" height="100" fill="#526fd0"/>
  <text class="layer-title" x="42" y="613">基础设施</text>
  <g transform="translate(84 632)">
    <rect class="framework-item" width="96" height="36"/><text class="item-text" x="48" y="18">配置中心</text>
    <rect class="framework-item" x="126" width="96" height="36"/><text class="item-text" x="174" y="18">注册中心</text>
    <rect class="framework-item" x="252" width="96" height="36"/><text class="item-text" x="300" y="18">应用网关</text>
    <rect class="planned" x="378" width="110" height="36"/><text class="item-text" x="433" y="18">分布式调度</text>
    <rect class="planned" x="518" width="110" height="36"/><text class="item-text" x="573" y="18">OSS</text>
    <rect class="planned" x="658" width="110" height="36"/><text class="item-text" x="713" y="18">分布式事务</text>
  </g>
</svg>
