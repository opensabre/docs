  <rect x="20" y="420" width="44" height="160" fill="#1976c9"/>
  <text class="layer-title" x="42" y="454">微服务框架</text>
  <g transform="translate(82 447)">
    <rect class="framework-item" width="96" height="36"/><text class="item-text" x="48" y="18">服务注册</text>
    <rect class="framework-item" x="112" width="96" height="36"/><text class="item-text" x="160" y="18">动态配置</text>
    <rect class="framework-item" x="224" width="96" height="36"/><text class="item-text" x="272" y="18">重试降级</text>
    <rect class="framework-item" x="336" width="96" height="36"/><text class="item-text" x="384" y="18">报文脱敏</text>
    <rect class="planned" x="448" width="120" height="36"/><text class="item-text" x="508" y="18">报文加解密</text>
    <rect class="framework-item" x="584" width="120" height="36"/><text class="item-text" x="644" y="18">统一响应报文</text>
    <rect class="framework-item" x="720" width="120" height="36"/><text class="item-text" x="780" y="18">实体对象转换</text>
    <rect class="framework-item" x="856" width="120" height="36"/><text class="item-text" x="916" y="18">统一异常响应码</text>
    <rect class="planned" x="992" width="96" height="36"/><text class="item-text" x="1040" y="18">双活多活</text>
    <rect class="planned" x="1104" width="42" height="94"/><text class="layer-title" x="1125" y="8">云原生支持</text>

    <rect class="framework-item" y="68" width="96" height="36"/><text class="item-text" x="48" y="86">服务发现</text>
    <rect class="framework-item" x="112" y="68" width="96" height="36"/><text class="item-text" x="160" y="86">多级缓存</text>
    <rect class="framework-item" x="224" y="68" width="96" height="36"/><text class="item-text" x="272" y="86">熔断限流</text>
    <rect class="framework-item" x="336" y="68" width="96" height="36"/><text class="item-text" x="384" y="86">日志脱敏</text>
    <rect class="framework-item" x="448" y="68" width="120" height="36"/><text class="item-text" x="508" y="86">配置加解密</text>
    <rect class="framework-item" x="584" y="68" width="120" height="36"/><text class="item-text" x="644" y="86">统一日志格式</text>
    <rect class="framework-item" x="720" y="68" width="120" height="36"/><text class="item-text" x="780" y="86">表单校验增强</text>
    <rect class="planned" x="856" y="68" width="120" height="36"/><text class="item-text" x="916" y="86">数据存取加解密</text>
    <rect class="planned" x="992" y="68" width="96" height="36"/><text class="item-text" x="1040" y="86">灰度路由</text>
