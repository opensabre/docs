<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">OpenSabre 框架架构图</title>
  <desc id="desc">OpenSabre 基础应用、微服务框架和基础设施三层架构</desc>
  <style>
    text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #263238; }
    .layer-title { fill: white; font-size: 18px; font-weight: 600; writing-mode: vertical-rl; letter-spacing: 4px; }
    .group-title { font-size: 17px; font-weight: 700; }
    .item-text { fill: white; font-size: 15px; text-anchor: middle; dominant-baseline: middle; }
    .planned { fill: #8d8d8d; }
    .app-item { fill: #52962f; }
    .framework-item { fill: #5475e8; }
    .group { fill: none; stroke: #52962f; stroke-width: 1.5; rx: 5; }
  </style>

  <rect width="1280" height="720" fill="#fff"/>

  <!-- 基础应用 -->
  <rect x="20" y="20" width="1240" height="380" fill="#c7e4c8"/>
  <rect x="20" y="20" width="44" height="380" fill="#348f3b"/>
  <text class="layer-title" x="42" y="165">基础应用</text>

  <g transform="translate(76 52)">
    <rect class="group" width="126" height="240"/>
    <text class="group-title" x="8" y="22">用户认证</text>
    <rect class="app-item" x="12" y="35" width="102" height="36"/><text class="item-text" x="63" y="53">用户授权</text>
    <rect class="app-item" x="12" y="87" width="102" height="36"/><text class="item-text" x="63" y="105">用户鉴权</text>
    <rect class="planned" x="12" y="139" width="102" height="36"/><text class="item-text" x="63" y="157">凭证管理</text>
    <rect class="app-item" x="12" y="191" width="102" height="36"/><text class="item-text" x="63" y="209">客户端管理</text>
  </g>
  <g transform="translate(214 52)">
    <rect class="group" width="132" height="140"/><text class="group-title" x="8" y="22">错误码管理</text>
    <rect class="app-item" x="16" y="35" width="100" height="36"/><text class="item-text" x="66" y="53">错误码收集</text>
    <rect class="app-item" x="16" y="87" width="100" height="36"/><text class="item-text" x="66" y="105">错误码查询</text>
  </g>
  <g transform="translate(214 210)">
    <rect class="group" width="132" height="82"/><text class="group-title" x="8" y="22">短链接</text>
    <rect class="planned" x="16" y="35" width="100" height="36"/><text class="item-text" x="66" y="53">规划中</text>
  </g>
