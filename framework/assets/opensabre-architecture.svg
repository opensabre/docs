      <rect class="app-item" width="92" height="34"/><text class="item-text" x="46" y="17">用户管理</text>
      <rect class="app-item" x="106" width="92" height="34"/><text class="item-text" x="152" y="17">角色管理</text>
      <rect class="app-item" x="212" width="92" height="34"/><text class="item-text" x="258" y="17">权限管理</text>
      <rect class="app-item" x="318" width="92" height="34"/><text class="item-text" x="364" y="17">资源管理</text>
      <rect class="app-item" x="424" width="92" height="34"/><text class="item-text" x="470" y="17">岗位管理</text>
      <rect class="app-item" x="530" width="92" height="34"/><text class="item-text" x="576" y="17">部门管理</text>
      <rect class="app-item" x="636" width="92" height="34"/><text class="item-text" x="682" y="17">菜单管理</text>
