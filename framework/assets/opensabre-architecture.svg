    <rect class="planned" x="16" y="35" width="116" height="36"/><text class="item-text" x="74" y="53">依赖包管理</text>
    <rect class="planned" x="148" y="35" width="116" height="36"/><text class="item-text" x="206" y="53">开源技术管理</text>
    <rect class="planned" x="16" y="87" width="116" height="36"/><text class="item-text" x="74" y="105">域/应用管理</text>
    <rect class="planned" x="148" y="87" width="116" height="36"/><text class="item-text" x="206" y="105">开源软件管理</text>
    <rect class="planned" x="16" y="139" width="116" height="36"/><text class="item-text" x="74" y="157">元数据管理</text>
    <rect class="planned" x="148" y="139" width="116" height="36"/><text class="item-text" x="206" y="157">开源技术管理</text>
  </g>

