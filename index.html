<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Opensabre官网</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Description">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <!-- 设置浏览器图标 -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <!-- 默认主题 -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">
    <link rel="stylesheet" href="https://unpkg.com/docsify-toc@1.0.0/dist/toc.css">
    <style>
        :root {
            --theme-color: #0f8f74;
            --os-page: #ffffff;
            --os-surface: #ffffff;
            --os-surface-soft: #f4f8fb;
            --os-ink: #122033;
            --os-muted: #5d6b7c;
            --os-border: #d9e5ee;
            --os-soft: #f4f8fb;
            --os-accent: #0f8f74;
            --os-accent-strong: #0b755f;
            --os-blue: #2e6edb;
            --os-hero-text: #102033;
            --os-hero-muted: #516276;
            --os-hero-panel: rgba(10, 28, 48, .92);
            --os-hero-panel-border: rgba(33, 148, 123, .28);
            --os-hero-chip: rgba(15, 143, 116, .10);
            --os-hero-chip-text: #0b755f;
        }

        body[data-theme="dark"],
        body.dark,
        html[data-theme="dark"] body {
            --theme-color: #5ee0bf;
            --os-page: #111820;
            --os-surface: #172231;
            --os-surface-soft: #1d2a3a;
            --os-ink: #edf5fb;
            --os-muted: #b5c5d4;
            --os-border: #304154;
            --os-soft: #182433;
            --os-accent: #5ee0bf;
            --os-accent-strong: #8cf0d6;
            --os-blue: #8ab4ff;
            --os-hero-text: #f5fbff;
            --os-hero-muted: #c6d6e5;
            --os-hero-panel: rgba(13, 25, 39, .96);
            --os-hero-panel-border: rgba(126, 230, 198, .28);
            --os-hero-chip: rgba(94, 224, 191, .14);
            --os-hero-chip-text: #a8f5df;
        }

        body {
            color: var(--os-ink);
            background: var(--os-page);
        }

        .markdown-section {
            max-width: 1120px;
            color: var(--os-ink);
        }

        .markdown-section h1,
        .markdown-section h2,
        .markdown-section h3 {
            letter-spacing: 0;
        }

        .markdown-section a {
            color: var(--os-accent-strong);
        }

        body[data-theme="dark"] .markdown-section a,
        body.dark .markdown-section a,
        html[data-theme="dark"] body .markdown-section a {
            color: var(--os-accent);
        }

        .markdown-section table {
            color: var(--os-ink);
        }

        .markdown-section tr:nth-child(2n) {
            background-color: var(--os-surface-soft);
        }

        .markdown-section th,
        .markdown-section td {
            border-color: var(--os-border);
        }

        .markdown-section > :first-child.os-home-hero-v2 {
            margin-top: -28px;
        }

        .os-home-hero-v2 {
            position: relative;
            overflow: hidden;
            grid-template-columns: minmax(0, 1fr) minmax(420px, 520px);
            min-height: 620px;
            margin: 0 -46px 34px;
            padding: 74px 56px 62px;
            border: 0;
            border-radius: 18px;
            background:
                linear-gradient(135deg, rgba(15, 143, 116, .12), rgba(46, 110, 219, .10) 48%, transparent 74%),
                radial-gradient(circle at 77% 28%, rgba(15, 143, 116, .16), transparent 30%),
                linear-gradient(135deg, #f8fbfd 0%, #edf5f8 56%, #e7f0f7 100%);
            box-shadow: 0 34px 88px rgba(31, 57, 84, .15);
        }

        .os-home-hero-v2::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(18, 32, 51, .055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(18, 32, 51, .055) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: linear-gradient(90deg, rgba(0, 0, 0, .85), transparent 78%);
            pointer-events: none;
        }

        .os-home-hero-v2::after {
            content: "";
            position: absolute;
            right: 38px;
            bottom: 36px;
            width: 220px;
            height: 220px;
            border: 1px solid rgba(15, 143, 116, .14);
            border-radius: 50%;
            box-shadow: inset 0 0 48px rgba(15, 143, 116, .14);
            pointer-events: none;
        }

        body[data-theme="dark"] .os-home-hero-v2,
        body.dark .os-home-hero-v2,
        html[data-theme="dark"] body .os-home-hero-v2 {
            background:
                linear-gradient(125deg, rgba(94, 224, 191, .16), rgba(138, 180, 255, .14) 42%, transparent 72%),
                radial-gradient(circle at 75% 24%, rgba(94, 224, 191, .20), transparent 30%),
                linear-gradient(135deg, #111923 0%, #172638 54%, #102d3b 100%);
            box-shadow: 0 34px 88px rgba(0, 0, 0, .30);
        }

        body[data-theme="dark"] .os-home-hero-v2::before,
        body.dark .os-home-hero-v2::before,
        html[data-theme="dark"] body .os-home-hero-v2::before {
            background-image:
                linear-gradient(rgba(255, 255, 255, .055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .055) 1px, transparent 1px);
        }

        .os-home-hero-v2 .os-home-copy,
        .os-home-hero-v2 .os-architecture-panel {
            position: relative;
            z-index: 1;
        }

        .os-home-mark {
            display: inline-flex;
            align-items: center;
            min-height: 32px;
            margin-bottom: 24px;
            padding: 0 12px;
            border: 1px solid rgba(139, 246, 212, .28);
            border-radius: 999px;
            background: var(--os-hero-chip);
            color: var(--os-hero-chip-text);
            font-size: 13px;
            font-weight: 700;
        }

        .os-home-hero-v2 .os-home-copy h1 {
            color: var(--os-hero-text);
            font-size: 88px;
            text-shadow: none;
        }

        .os-home-hero-v2 .os-home-lead {
            max-width: 690px;
            color: var(--os-hero-muted);
            font-size: 23px;
        }

        .os-home-hero-v2 .os-home-actions a {
            background: #12b886;
            box-shadow: 0 18px 42px rgba(18, 184, 134, .32);
        }

        .os-home-hero-v2 .os-home-actions a.secondary {
            background: rgba(255, 255, 255, .78);
            color: var(--os-hero-text);
            border-color: rgba(18, 32, 51, .14);
            box-shadow: none;
        }

        body[data-theme="dark"] .os-home-hero-v2 .os-home-actions a.secondary,
        body.dark .os-home-hero-v2 .os-home-actions a.secondary,
        html[data-theme="dark"] body .os-home-hero-v2 .os-home-actions a.secondary {
            background: rgba(255, 255, 255, .08);
            color: #f8fbff;
            border-color: rgba(255, 255, 255, .22);
        }

        .os-home-proof {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 34px;
        }

        .os-home-proof span {
            display: inline-flex;
            align-items: center;
            min-height: 30px;
            padding: 0 10px;
            border-radius: 6px;
            background: var(--os-hero-chip);
            color: var(--os-hero-chip-text);
            font-size: 13px;
            font-weight: 650;
        }

        .os-home-hero {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 440px;
            gap: 56px;
            align-items: center;
            min-height: 540px;
            padding: 48px 0 34px;
            border-bottom: 1px solid var(--os-border);
        }

        .os-home-copy h1 {
            margin: 0 0 22px;
            font-size: 72px;
            line-height: 0.95;
            font-weight: 760;
            color: var(--os-ink);
        }

        .os-home-lead {
            max-width: 650px;
            margin: 0;
            font-size: 22px;
            line-height: 1.72;
            color: var(--os-muted);
        }

        .os-home-actions,
        .os-cover-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 34px;
        }

        .os-home-actions a,
        .os-cover-actions a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 20px;
            border-radius: 8px;
            background: var(--os-accent);
            color: #fff;
            font-size: 15px;
            font-weight: 650;
            text-decoration: none;
            box-shadow: 0 10px 26px rgba(15, 159, 122, 0.22);
        }

        .os-home-actions a.secondary,
        .os-cover-actions a.secondary {
            background: #fff;
            color: var(--os-ink);
            border: 1px solid var(--os-border);
            box-shadow: none;
        }

        .os-architecture-panel {
            position: relative;
            padding: 28px;
            border: 1px solid var(--os-border);
            border-radius: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #f7fbfd 100%);
            box-shadow: 0 24px 60px rgba(20, 33, 61, 0.12);
        }

        .os-architecture-panel-v2 {
            padding: 0;
            border: 1px solid var(--os-hero-panel-border);
            border-radius: 14px;
            background: var(--os-hero-panel);
            box-shadow: 0 26px 80px rgba(18, 32, 51, .22);
            backdrop-filter: blur(16px);
        }

        .os-panel-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid rgba(170, 218, 245, .16);
            color: #c5d5e2;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .os-panel-top strong {
            color: #91f0d8;
        }

        .os-stack-base {
            margin: 22px;
            padding: 18px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(15, 143, 116, .94), rgba(46, 110, 219, .86));
            color: #fff;
            font-size: 16px;
            font-weight: 760;
            text-align: center;
        }

        .os-stack-lanes {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            padding: 0 22px 22px;
        }

        .os-stack-lanes div {
            min-height: 132px;
            padding: 16px;
            border: 1px solid rgba(170, 218, 245, .16);
            border-radius: 10px;
            background: rgba(255, 255, 255, .055);
        }

        .os-stack-lanes strong {
            display: block;
            margin-bottom: 12px;
            color: #fff;
            font-size: 15px;
        }

        .os-stack-lanes span,
        .os-stack-flow span {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            margin: 0 6px 8px 0;
            padding: 0 9px;
            border-radius: 6px;
            background: rgba(139, 246, 212, .10);
            color: #b9f8e3;
            font-size: 13px;
            font-weight: 650;
        }

        .os-stack-flow {
            display: flex;
            flex-wrap: wrap;
            padding: 18px 22px 20px;
            border-top: 1px solid rgba(170, 218, 245, .16);
        }

        .os-panel-title {
            margin-bottom: 18px;
            color: var(--os-muted);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .os-module-row {
            padding: 16px 18px;
            border: 1px solid var(--os-border);
            border-radius: 8px;
            background: #fff;
            color: var(--os-ink);
            font-weight: 680;
            text-align: center;
        }

        .os-module-row.primary {
            background: #10243e;
            border-color: #10243e;
            color: #fff;
        }

        .os-module-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin: 18px 0;
        }

        .os-module-grid span {
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #d4e5f1;
            border-radius: 8px;
            background: #f9fcfe;
            color: #254761;
            font-size: 14px;
            font-weight: 650;
        }

        .os-flow-line {
            width: 2px;
            height: 26px;
            margin: -2px auto 12px;
            background: linear-gradient(var(--os-blue), var(--os-accent));
        }

        .os-entry-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            padding: 34px 0 22px;
        }

        .os-entry-card {
            display: block;
            min-height: 132px;
            padding: 22px;
            border: 1px solid var(--os-border);
            border-radius: 8px;
            background: var(--os-surface);
            color: inherit;
            text-decoration: none;
            transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
        }

        .os-entry-card:hover {
            border-color: rgba(15, 159, 122, .55);
            transform: translateY(-2px);
            box-shadow: 0 16px 38px rgba(20, 33, 61, .10);
            text-decoration: none;
        }

        .os-entry-card strong {
            display: block;
            margin-bottom: 12px;
            color: var(--os-ink);
            font-size: 20px;
        }

        .os-entry-card span {
            color: var(--os-muted);
            font-size: 15px;
            line-height: 1.65;
        }

        .os-release-strip {
            display: grid;
            gap: 12px;
            margin: 18px 0 32px;
        }

        .os-release-strip div {
            display: grid;
            grid-template-columns: 92px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
            padding: 16px 18px;
            border-left: 3px solid var(--os-accent);
            background: var(--os-soft);
            border-radius: 0 8px 8px 0;
        }

        .os-release-strip strong {
            color: var(--os-ink);
        }

        .os-release-strip span {
            color: var(--os-muted);
            line-height: 1.65;
        }

        .cover-main {
            max-width: none;
        }

        .os-cover {
            display: flex;
            min-height: 72vh;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            background:
                linear-gradient(120deg, rgba(15, 143, 116, .09), rgba(46, 110, 219, .08)),
                var(--os-page);
        }

        .os-cover-inner {
            max-width: 860px;
            text-align: center;
        }

        .os-cover h1 {
            margin: 0 0 18px;
            color: var(--os-ink);
            font-size: 76px;
            line-height: 1;
            font-weight: 780;
        }

        .os-cover p {
            margin: 0 auto;
            max-width: 640px;
            color: var(--os-muted);
            font-size: 24px;
            line-height: 1.6;
        }

        .os-cover-actions {
            justify-content: center;
        }

        .os-cover-links {
            display: flex;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
            margin-top: 34px;
        }

        .os-cover-links a {
            color: var(--os-muted);
            font-size: 15px;
            font-weight: 650;
            text-decoration: none;
        }

        .os-cover-links a:hover {
            color: var(--os-accent);
        }

        @media (max-width: 980px) {
            .os-home-hero {
                grid-template-columns: 1fr;
                gap: 32px;
                min-height: auto;
            }

            .os-home-copy h1,
            .os-cover h1 {
                font-size: 54px;
            }

            .os-entry-grid {
                grid-template-columns: 1fr;
            }

            .os-home-hero-v2 {
                margin: 0 0 28px;
                padding: 52px 30px;
            }
        }

        @media (max-width: 560px) {
            .markdown-section {
                padding: 28px 18px;
            }

            .os-home-copy h1,
            .os-cover h1 {
                font-size: 42px;
            }

            .os-home-lead,
            .os-cover p {
                font-size: 18px;
            }

            .os-architecture-panel {
                padding: 18px;
            }

            .os-architecture-panel-v2 {
                padding: 0;
            }

            .os-home-hero-v2 {
                padding: 42px 20px;
                border-radius: 12px;
            }

            .os-home-hero-v2 .os-home-copy h1 {
                font-size: 48px;
            }

            .os-stack-lanes {
                grid-template-columns: 1fr;
            }

            .os-release-strip div {
                grid-template-columns: 1fr;
                gap: 6px;
            }
        }
    </style>
</head>

<body>
    <!-- 定义加载时候的动作 -->
    <div id="app">加载中...</div>
    <script>
        window.$docsify = {
            // 项目名称
            name: 'Opensabre官网',
            // 仓库地址，点击右上角的Github章鱼猫头像会跳转到此地址
            repo: 'https://github.com/opensabre',
            // 侧边栏支持，默认加载的是项目根目录下的_sidebar.md文件
            loadSidebar: true,
            // 导航栏支持，默认加载的是项目根目录下的_navbar.md文件
            loadNavbar: true,
            // 封面支持，默认加载的是项目根目录下的_coverpage.md文件
            coverpage: true,
            // 最大支持渲染的标题层级
            maxLevel: 3,
            // 自定义侧边栏后默认不会再生成目录，设置生成目录的最大层级（建议配置为2-4）
            subMaxLevel: 1,
            // 小屏设备下合并导航栏到侧边栏
            mergeNavbar: true,
            // 滚动到锚点是与顶部的距离
            topMargin: 90,
            auto2top: true,
        }
    </script>
    <script>
        // 搜索配置(url：https://docsify.js.org/#/zh-cn/plugins?id=%e5%85%a8%e6%96%87%e6%90%9c%e7%b4%a2-search)
        window.$docsify = Object.assign(window.$docsify || {}, {
            darklightTheme: {
                defaultTheme: 'light',
                siteFont: 'Source Sans Pro,Helvetica Neue,Arial,sans-serif',
                codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
                bodyFontSize: '14px',
                dark: {
                    background: 'rgb(28,32,34)',
                    highlightColor: '#e96900',
                    codeBackgroundColor: 'rgb(34,39,46)',
                    codeTextColor: '#b4b4b4',
                },
                light: {
                    highlightColor: '#e96900',
                }
            },
            search: {
                maxAge: 86400000,// 过期时间，单位毫秒，默认一天
                paths: 'auto',// 注意：仅适用于 paths: 'auto' 模式
                placeholder: '搜索',
                // 支持本地化
                placeholder: {
                    '/zh-cn/': '搜索',
                    '/': 'Search'
                },
                noData: '找不到结果',
                depth: 4,
                hideOtherSidebarContent: false,
                namespace: 'Docsify-Guide',
            },
            toc: {
              scope: '.markdown-section',
              headings: 'h2, h3, h4, h5, h6',
              title: '目录',
            },
            'flexible-alerts': {
              style: 'flat',
              note: {
                  label: "信息"
              },
              tip: {
                  label: "提示"
              },
              warning: {
                  label: "注意"
              },
              attention: {
                  label: "切记"
              }
            },
            progress: {
              position: "top",
              color: "var(--theme-color,#42b983)",
              height: "3px",
            },
            formatUpdated: '{MM}/{DD} {HH}:{mm}',
        })
    </script>
    <!-- docsify的js依赖 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
    <!-- emoji表情支持 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
    <!-- 图片放大缩小支持 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
    <!-- 搜索功能支持 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <!--在所有的代码块上添加一个简单的Click to copy按钮来允许用户从你的文档中轻易地复制代码-->
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
    <!--白天/夜间模式切换-->
    <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
    <!-- docsify-tabs (latest v1.x.x) -->
    <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
    <!--代码高亮-->
    <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-json.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-java.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-bash.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-yaml.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-sql.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-xml-doc.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-properties.min.js"></script>
    <!-- 上一篇/下一篇 -->
    <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
    <!-- 重点提示 -->
    <script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>
    <!-- 文章内部生成目录 -->
    <script src="https://unpkg.com/docsify-toc@1.0.0/dist/toc.js"></script>
    <!-- 阅读进度 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify-progress@latest/dist/progress.min.js"></script>
